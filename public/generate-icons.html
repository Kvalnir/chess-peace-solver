<!DOCTYPE html>
<!--
  ♟ Chess Peace Solver — Icon Generator
  ══════════════════════════════════════
  Open this file in any browser.
  Click the three "Download" buttons.
  Upload the saved PNGs into your repo under public/icons/

  icon-192.png & icon-512.png  →  transparent circle  (Android / desktop)
  apple-touch-icon.png         →  solid dark background (iOS fills transparency
                                   with white, so we own the colour instead)
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Icon Generator — Chess Peace Solver</title>
    <style>
      body {
        font-family: monospace;
        background: #080c10;
        color: #e6edf3;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 32px;
        padding: 48px 24px;
        min-height: 100vh;
        margin: 0;
      }
      h1 { color: #2dd4bf; font-size: 1.2rem; margin: 0; }
      p  { color: #7d8590; font-size: 0.85rem; margin: 0; text-align: center; max-width: 420px; }
      .card {
        background: #0d1117;
        border: 1px solid #21262d;
        border-radius: 12px;
        padding: 24px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 12px;
        width: 280px;
      }
      /* Circle preview for transparent icons */
      canvas.circle  { border-radius: 50%;  border: 1px solid #30363d; }
      /* Squircle preview for the iOS icon — mimics how iOS rounds it */
      canvas.squircle { border-radius: 22%; border: 1px solid #30363d; }
      button {
        background: #2dd4bf;
        color: #080c10;
        border: none;
        border-radius: 8px;
        padding: 10px 24px;
        font-family: monospace;
        font-weight: bold;
        font-size: 0.9rem;
        cursor: pointer;
        width: 100%;
      }
      button:hover { background: #5eead4; }
      label { color: #7d8590; font-size: 0.75rem; }
      .note {
        color: #fbbf24;
        font-size: 0.75rem;
        text-align: center;
        line-height: 1.5;
      }
    </style>
  </head>
  <body>
    <h1>♟ Chess Peace Solver — Icon Generator</h1>
    <p>Click each Download button, then upload the saved files into <code>public/icons/</code> in your repo.</p>

    <div class="card">
      <label>icon-192.png · Android / Desktop PWA</label>
      <canvas id="c192" class="circle" width="192" height="192"></canvas>
      <button onclick="dl('c192','icon-192.png')">⬇ Download icon-192.png</button>
    </div>

    <div class="card">
      <label>icon-512.png · Android Large / Splash</label>
      <canvas id="c512" class="circle" width="512" height="512"></canvas>
      <button onclick="dl('c512','icon-512.png')">⬇ Download icon-512.png</button>
    </div>

    <div class="card">
      <label>apple-touch-icon.png · iOS Home Screen</label>
      <canvas id="c180" class="squircle" width="180" height="180"></canvas>
      <p class="note">
        Solid dark background — iOS fills any transparency with white,
        so this owns the background colour. iOS applies its own rounded
        corners (previewed above).
      </p>
      <button onclick="dl('c180','apple-touch-icon.png')">⬇ Download apple-touch-icon.png</button>
    </div>

    <script>
      // ─── Shared design (rings + knight + grid) ───────────────────────────
      function drawDesign(ctx, s) {
        // Radial glow
        const grad = ctx.createRadialGradient(s/2, s/2, 0, s/2, s/2, s * 0.65);
        grad.addColorStop(0,   'rgba(45,212,191,0.18)');
        grad.addColorStop(0.5, 'rgba(45,212,191,0.06)');
        grad.addColorStop(1,   'rgba(45,212,191,0.00)');
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, s, s);

        // Outer ring
        ctx.strokeStyle = '#2dd4bf';
        ctx.lineWidth = s * 0.025;
        ctx.beginPath();
        ctx.arc(s/2, s/2, s * 0.43, 0, Math.PI * 2);
        ctx.stroke();

        // Inner subtle ring
        ctx.strokeStyle = 'rgba(45,212,191,0.3)';
        ctx.lineWidth = s * 0.012;
        ctx.beginPath();
        ctx.arc(s/2, s/2, s * 0.36, 0, Math.PI * 2);
        ctx.stroke();

        // Knight glyph
        ctx.fillStyle = '#2dd4bf';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.font = `${s * 0.44}px serif`;
        ctx.fillText('♞', s / 2, s / 2 + s * 0.03);

        // Faint chess grid
        ctx.strokeStyle = 'rgba(45,212,191,0.06)';
        ctx.lineWidth = s * 0.005;
        const cell = s / 8;
        for (let i = 1; i < 8; i++) {
          ctx.beginPath(); ctx.moveTo(i * cell, 0); ctx.lineTo(i * cell, s); ctx.stroke();
          ctx.beginPath(); ctx.moveTo(0, i * cell); ctx.lineTo(s, i * cell); ctx.stroke();
        }
      }

      // ─── Circular transparent icon (Android / desktop) ───────────────────
      // Clips to a circle — pixels outside are transparent in the saved PNG.
      function drawCircleIcon(canvas) {
        const s = canvas.width;
        const ctx = canvas.getContext('2d');

        ctx.beginPath();
        ctx.arc(s / 2, s / 2, s / 2, 0, Math.PI * 2);
        ctx.clip();

        ctx.fillStyle = '#080c10';
        ctx.fillRect(0, 0, s, s);
        drawDesign(ctx, s);
      }

      // ─── Solid-background icon (iOS apple-touch-icon) ────────────────────
      // NO circle clip — fills the full square with the app's dark colour.
      // iOS adds white behind any transparency, so we own it instead.
      // iOS then applies its own rounded-square mask at render time.
      function drawSolidIcon(canvas) {
        const s = canvas.width;
        const ctx = canvas.getContext('2d');

        ctx.fillStyle = '#080c10';
        ctx.fillRect(0, 0, s, s);
        drawDesign(ctx, s);
      }

      // ─── Download helper ─────────────────────────────────────────────────
      function dl(id, filename) {
        const canvas = document.getElementById(id);
        const link = document.createElement('a');
        link.download = filename;
        link.href = canvas.toDataURL('image/png');
        link.click();
      }

      // ─── Render ──────────────────────────────────────────────────────────
      drawCircleIcon(document.getElementById('c192'));
      drawCircleIcon(document.getElementById('c512'));
      drawSolidIcon(document.getElementById('c180'));
    </script>
  </body>
</html>
