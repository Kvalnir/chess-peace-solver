<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover lets content sit under iPhone notch/Dynamic Island -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />

    <meta
      name="description"
      content="Solve Chess Peace puzzles — place every chess piece so none can capture another. Installable PWA, works offline."
    />

    <!-- ── Standard PWA ─────────────────────────────────────────────── -->
    <!-- Single status-bar colour, kept in sync by the script below + App.jsx. -->
    <meta name="theme-color" content="#080c10" />
    <link rel="manifest" href="/chess-peace-solver/manifest.webmanifest" />

    <!-- Apply the saved theme (and matching status-bar colour) before first
         paint to avoid a flash. No choice / "system" follows the OS via the
         stylesheet's `color-scheme: light dark`. -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem("theme") || "system";
          if (t === "light" || t === "dark")
            document.documentElement.setAttribute("data-theme", t);
          var dark =
            t === "dark" ||
            (t === "system" &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
          var m = document.querySelector('meta[name="theme-color"]');
          if (m) m.setAttribute("content", dark ? "#080c10" : "#e8ebef");
        } catch (e) {}
      })();
    </script>

    <!-- ── iOS-specific (Safari ignores the manifest for these) ─────── -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="apple-mobile-web-app-title" content="Chess Peace Solver" />
    <link
      rel="apple-touch-icon"
      href="/chess-peace-solver/icons/apple-touch-icon.png"
    />

    <!-- ── Misc ─────────────────────────────────────────────────────── -->
    <meta name="format-detection" content="telephone=no" />
    <link rel="icon" type="image/svg+xml" href="/chess-peace-solver/icons/icon.svg" />

    <!-- ── Typography: JetBrains Mono (technical labels) +
             Crimson Pro (elegant chess-bookish title) ──────────────── -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Crimson+Pro:wght@400;600&family=JetBrains+Mono:wght@400;500;700&display=swap"
      rel="stylesheet"
    />

    <title>Chess Peace Solver</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
