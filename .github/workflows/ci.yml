# CI: every push to main and every PR installs the exact versions in
# package-lock.json, scans them for known vulnerabilities, and proves the
# production bundle still builds.
#
# The weekly scheduled run keeps the audit honest even when no commits land:
# an advisory published against an unchanged main turns the check red instead
# of staying green forever. Dependabot PRs ride this same pipeline, so
# "merge when green" carries real assurance.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Same Node as the deploy workflow, so a green check here means the
      # deploy's build will pass too.
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      # npm ci installs exactly what package-lock.json records and fails if it
      # disagrees with package.json, so the audit below scans what actually
      # ships rather than whatever the registry's newest matching versions are.
      - name: Install dependencies
        run: npm ci

      # Checks every installed package, build tools included: a Vite
      # dev-server advisory still matters when running `npm run dev` locally.
      # Fails the job on any known vulnerability.
      - name: Audit dependencies for vulnerabilities
        run: npm audit

      - name: Build production bundle
        run: npm run build
